name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/test/gemfiles/${{ matrix.gemfile }}.gemfile
    strategy:
      fail-fast: false
      matrix:
        # Explicit ruby/gemfile pairs, per https://www.fastruby.io/blog/ruby/rails/versions/compatibility-table.html
        # Ruby 4.0/head aren't covered there, so only maintained Rails lines (8.0+) get experimental legs on them.
        include:
          - ruby: "2.3"
            gemfile: "5.0"
            experimental: false
          - ruby: "2.4"
            gemfile: "5.0"
            experimental: false
          - ruby: "2.3"
            gemfile: "5.1"
            experimental: false
          - ruby: "2.4"
            gemfile: "5.1"
            experimental: false
          - ruby: "2.5"
            gemfile: "5.1"
            experimental: false
          - ruby: "2.3"
            gemfile: "5.2"
            experimental: false
          - ruby: "2.4"
            gemfile: "5.2"
            experimental: false
          - ruby: "2.5"
            gemfile: "5.2"
            experimental: false
          - ruby: "2.6"
            gemfile: "5.2"
            experimental: false
          - ruby: "2.5"
            gemfile: "6.0"
            experimental: false
          - ruby: "2.6"
            gemfile: "6.0"
            experimental: false
          - ruby: "2.7"
            gemfile: "6.0"
            experimental: false
          - ruby: "2.5"
            gemfile: "6.1"
            experimental: false
          - ruby: "2.6"
            gemfile: "6.1"
            experimental: false
          - ruby: "2.7"
            gemfile: "6.1"
            experimental: false
          - ruby: "3.0"
            gemfile: "6.1"
            experimental: false
          - ruby: "2.7"
            gemfile: "7.0"
            experimental: false
          - ruby: "3.0"
            gemfile: "7.0"
            experimental: false
          - ruby: "2.7"
            gemfile: "7.1"
            experimental: false
          - ruby: "3.0"
            gemfile: "7.1"
            experimental: false
          - ruby: "3.1"
            gemfile: "7.1"
            experimental: false
          - ruby: "3.2"
            gemfile: "7.1"
            experimental: false
          - ruby: "3.3"
            gemfile: "7.1"
            experimental: false
          - ruby: "3.4"
            gemfile: "7.1"
            experimental: false
          - ruby: "3.1"
            gemfile: "7.2"
            experimental: false
          - ruby: "3.2"
            gemfile: "7.2"
            experimental: false
          - ruby: "3.3"
            gemfile: "7.2"
            experimental: false
          - ruby: "3.4"
            gemfile: "7.2"
            experimental: false
          - ruby: "3.2"
            gemfile: "8.0"
            experimental: false
          - ruby: "3.3"
            gemfile: "8.0"
            experimental: false
          - ruby: "3.4"
            gemfile: "8.0"
            experimental: false
          - ruby: "3.2"
            gemfile: "8.1"
            experimental: false
          - ruby: "3.3"
            gemfile: "8.1"
            experimental: false
          - ruby: "3.4"
            gemfile: "8.1"
            experimental: false
          - ruby: "4.0"
            gemfile: "8.0"
            experimental: true
          - ruby: "head"
            gemfile: "8.0"
            experimental: true
          - ruby: "4.0"
            gemfile: "8.1"
            experimental: true
          - ruby: "head"
            gemfile: "8.1"
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rake test
